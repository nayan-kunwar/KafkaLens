# Local investigation stack. Host tools use localhost:9092.
# Containers use kafka:9094. Start infra with `docker compose up -d`.
# Run one failure scenario with `docker compose --profile slow-consumer up demo-slow-consumer`.

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kafka_inspector
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kafka_inspector']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-lens:
    build: .
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9094
      KAFKA_CLIENT_ID: kafka-inspector
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/kafka_inspector
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      METRICS_ENABLED: 'true'
      METRICS_PORT: '9464'
    ports:
      - '9464:9464'
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  demo-slow-consumer:
    profiles: ['slow-consumer']
    build: .
    command: ['node', 'dist/demo/slow-consumer.js']
    environment:
      KAFKA_BROKERS: kafka:9094
      DEMO_DURATION_SECONDS: '120'
    depends_on:
      kafka:
        condition: service_healthy

  demo-stalled-consumer:
    profiles: ['stalled-consumer']
    build: .
    command: ['node', 'dist/demo/stalled-consumer.js']
    environment:
      KAFKA_BROKERS: kafka:9094
      DEMO_DURATION_SECONDS: '120'
    depends_on:
      kafka:
        condition: service_healthy

  demo-partition-hotspot:
    profiles: ['partition-hotspot']
    build: .
    command: ['node', 'dist/demo/partition-hotspot.js']
    environment:
      KAFKA_BROKERS: kafka:9094
      DEMO_DURATION_SECONDS: '120'
    depends_on:
      kafka:
        condition: service_healthy

  demo-producer-spike:
    profiles: ['producer-spike']
    build: .
    command: ['node', 'dist/demo/producer-spike.js']
    environment:
      KAFKA_BROKERS: kafka:9094
      DEMO_DURATION_SECONDS: '90'
    depends_on:
      kafka:
        condition: service_healthy
